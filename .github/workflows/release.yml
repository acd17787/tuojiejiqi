name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Build Sidecar (net48 fallback)
        run: dotnet build Sidecar/Sidecar.csproj -c Release -f net48

      - name: Build Sidecar (net7.0-windows)
        run: dotnet build Sidecar/Sidecar.csproj -c Release -f net7.0-windows

      - name: Build Plugin (net48 - Rhino 7/8)
        run: dotnet build AIRenderer.csproj -c Release -f net48

      - name: Build Plugin (net7.0-windows - Rhino 8)
        run: dotnet build AIRenderer.csproj -c Release -f net7.0-windows

      - name: Package net48
        run: |
          mkdir -p dist/TuoJie-Rhino7-${{ github.ref_name }}
          cp bin/Release/net48/TuoJie.rhp        dist/TuoJie-Rhino7-${{ github.ref_name }}/
          cp bin/Release/net48/*.dll             dist/TuoJie-Rhino7-${{ github.ref_name }}/
          cp bin/Release/net48/TuoJieSidecar.exe dist/TuoJie-Rhino7-${{ github.ref_name }}/
          cp bin/Release/net48/TuoJieSidecar.exe.config dist/TuoJie-Rhino7-${{ github.ref_name }}/
          cp bin/Release/net48/diagnose.bat      dist/TuoJie-Rhino7-${{ github.ref_name }}/
          cd dist
          Compress-Archive -Path TuoJie-Rhino7-${{ github.ref_name }} -DestinationPath TuoJie-Rhino7-${{ github.ref_name }}.zip
        shell: pwsh

      - name: Package net7.0-windows
        run: |
          mkdir -p dist/TuoJie-Rhino8-${{ github.ref_name }}
          cp bin/Release/net7.0-windows/TuoJie.rhp              dist/TuoJie-Rhino8-${{ github.ref_name }}/
          cp bin/Release/net7.0-windows/*.dll                   dist/TuoJie-Rhino8-${{ github.ref_name }}/
          cp bin/Release/net7.0-windows/*.json                  dist/TuoJie-Rhino8-${{ github.ref_name }}/
          cp bin/Release/net7.0-windows/TuoJieSidecar.exe       dist/TuoJie-Rhino8-${{ github.ref_name }}/
          cp bin/Release/net7.0-windows/TuoJieSidecar-net48.exe dist/TuoJie-Rhino8-${{ github.ref_name }}/
          cp bin/Release/net7.0-windows/TuoJieSidecar-net48.exe.config dist/TuoJie-Rhino8-${{ github.ref_name }}/
          cp -r bin/Release/net7.0-windows/net48-sidecar        dist/TuoJie-Rhino8-${{ github.ref_name }}/
          cp bin/Release/net7.0-windows/diagnose.bat            dist/TuoJie-Rhino8-${{ github.ref_name }}/
          cp -r bin/Release/net7.0-windows/runtimes             dist/TuoJie-Rhino8-${{ github.ref_name }}/
          cd dist
          Compress-Archive -Path TuoJie-Rhino8-${{ github.ref_name }} -DestinationPath TuoJie-Rhino8-${{ github.ref_name }}.zip
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: TuoJie ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist/TuoJie-Rhino7-${{ github.ref_name }}.zip
            dist/TuoJie-Rhino8-${{ github.ref_name }}.zip
          body: |
            ## TuoJie AI Renderer ${{ github.ref_name }}

            ### Install
            - Rhino 8 recommended: download `TuoJie-Rhino8-*.zip`, extract it, then drag `TuoJie.rhp` into Rhino.
            - Rhino 7 / fallback: download `TuoJie-Rhino7-*.zip`, extract it, then drag `TuoJie.rhp` into Rhino.
            - Keep `TuoJie.rhp`, `TuoJieSidecar.exe`, DLL/JSON files, and `runtimes/` in the same folder.
            - Run `diagnose.bat` from the extracted folder if Rhino cannot load the plugin or API calls fail.
